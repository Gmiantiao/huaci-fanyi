<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部收藏 - 拾词</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="words-container">
    <!-- Header -->
    <div class="words-header">
      <h1>📖 全部收藏</h1>
      <div class="header-actions">
        <span class="header-count" id="totalCount">0 条</span>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="words-toolbar">
      <div class="toolbar-left">
        <label class="select-all-label">
          <input type="checkbox" id="selectAll">
          <span>全选</span>
        </label>
        <span class="select-count" id="selectCount">已选 0 项</span>
      </div>
      <div class="toolbar-right">
        <input type="text" id="searchInput" placeholder="搜索词汇或翻译...">
        <button class="btn btn-primary" id="downloadBtn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          导出
        </button>
        <button class="btn btn-danger" id="clearAll">清空全部</button>
      </div>
    </div>

    <!-- Download hint -->
    <div class="download-hint" id="downloadHint" style="display:none;"></div>

    <!-- Word List -->
    <div class="words-list" id="wordList">
      <div class="empty-state" id="emptyState">
        <span class="empty-icon">📝</span>
        <p>还没有收藏词汇</p>
        <p class="empty-hint">在网页中划选英文或中文即可翻译收藏</p>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
